name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms android --org ir.asia --project-name asia_prices .
      - name: Patch manifest
        run: |
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          perm='<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    '
          i=s.index('<application')
          s=s[:i]+perm+s[i:]
          s=re.sub(r'android:label="[^"]*"','android:label="لیست قیمت آسیا"',s,count=1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          grep -n "CAMERA" android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: asia-prices-apk
          path: build/app/outputs/flutter-apk/app-release.apk
